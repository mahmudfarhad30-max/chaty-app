<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Advanced Web Chat App</title>
    <style>
        /* আগের এবং নতুন সব স্টাইল একসাথে */
        body {
            margin: 0;
            padding: 0;
            background-color: #111b21;
            font-family: sans-serif;
            color: #e9edef;
        }
        .msg-time {
            font-size: 9px;
            color: #8696a0;
            text-align: right;
            margin-top: 3px;
            display: inline-block;
            float: right;
            margin-left: 8px;
        }
        .chat-input-area {
            padding: 8px 10px;
            background: #202c33;
            display: flex;
            gap: 8px;
            align-items: center;
            flex-shrink: 0;
        }
        .chat-input-area input[type="text"] {
            flex: 1;
            padding: 9px 12px;
            border: none;
            background: #2a3942;
            color: #e9edef;
            border-radius: 20px;
            outline: none;
            font-size: 13px;
        }
        .action-icon-btn {
            background: none;
            border: none;
            color: #8696a0;
            font-size: 18px;
            cursor: pointer;
        }
        .send-btn {
            background: #00a884;
            color: #111b21;
            border: none;
            padding: 0 14px;
            height: 36px;
            border-radius: 20px;
            cursor: pointer;
            font-weight: bold;
            font-size: 12px;
        }
        /* নতুন ফিচারের জন্য ছোট কিছু স্টাইল */
        .typing-indicator {
            font-size: 11px;
            color: #00a884;
            padding: 2px 15px;
            font-style: italic;
        }
        .reaction-picker {
            display: none;
            position: absolute;
            background: #233138;
            border-radius: 20px;
            padding: 4px 8px;
            gap: 6px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.3);
            z-index: 10;
        }
        .reaction-picker span {
            cursor: pointer;
            font-size: 16px;
        }
    </style>
</head>
<body>

    <!-- চ্যাট ইন্টারফেসের মূল স্ট্রাকচার -->
    <div id="homeScreen" class="screen active">
        <div style="padding: 15px; background: #202c33; display: flex; justify-content: space-between; align-items: center;">
            <h2>Chats</h2>
            <input type="text" id="searchInput" placeholder="Search or start new chat" onkeyup="filterOrStartChat()" style="padding: 6px 12px; border-radius: 15px; border: none; background: #2a3942; color: white;">
        </div>
        <div id="friendListContainer"></div>
    </div>

    <div id="chatScreen" class="screen" style="display:none; flex-direction:column; height:100vh;">
        <div style="padding: 10px 15px; background: #202c33; display: flex; align-items: center; gap: 10px;">
            <button onclick="goBackHome()" style="background:none; border:none; color:white; cursor:pointer;">⬅</button>
            <h3 id="chatTargetName" style="margin:0; flex:1;"></h3>
            <!-- শেয়ার অপশন বা বাটন -->
            <button onclick="shareAppOrChat()" class="action-icon-btn" title="Share">🔗</button>
        </div>

        <div id="chatMessagesContainer" style="flex:1; overflow-y:auto; padding: 15px; display:flex; flex-direction:column; gap:10px;"></div>
        
        <!-- লাইভ টাইপিং ইন্ডিকেটর দেখানোর জায়গা -->
        <div id="typingStatus" class="typing-indicator"></div>

        <div class="chat-input-area">
            <!-- ফাইল বা ছবি আপলোড করার ইনপুট (লুকানো) -->
            <input type="file" id="mediaFileInput" style="display: none;" onchange="handleMediaUpload(this)">
            <button class="action-icon-btn" onclick="document.getElementById('mediaFileInput').click()">📎</button>
            
            <!-- ভয়েস রেকর্ড বাটন -->
            <button class="action-icon-btn" id="voiceRecordBtn" onclick="toggleVoiceRecording()">🎤</button>

            <input type="text" id="messageInput" placeholder="Type a message" onkeypress="handleEnter(event)" oninput="notifyTyping()">
            <button class="send-btn" onclick="sendMessage()">Send</button>
        </div>
    </div>

<script>
    // ফায়ারবেস এবং চ্যাট লজিক ফাংশনগুলো
    function getChatId(user1, user2) {
        return user1 < user2 ? `${user1}_${user2}` : `${user2}_${user1}`;
    }

    function loadFriendList() {
        const container = document.getElementById('friendListContainer');
        onValue(ref(db, 'user-chats/' + currentUser), (snapshot) => {
            container.innerHTML = "";
            if (!snapshot.exists()) {
                container.innerHTML = `<div class="empty-state" style="padding:20px; text-align:center; color:#8696a0;">No chats yet. Pick a contact above!</div>`;
                return;
            }
            allChatsData = snapshot.val();
            renderChatList(allChatsData);
        });
    }

    function renderChatList(chats) {
        const container = document.getElementById('friendListContainer');
        container.innerHTML = "";
        Object.keys(chats).forEach(partnerPhone => {
            const lastMsg = chats[partnerPhone].lastMessage || "";
            const displayName = savedContactNames[partnerPhone] || partnerPhone;
            const div = document.createElement('div');
            div.className = 'friend-item';
            div.style.cssText = "padding: 12px 15px; border-bottom: 1px solid #222d34; display: flex; gap: 12px; cursor: pointer;";
            div.onclick = () => openChat(partnerPhone);
            div.innerHTML = `
                <div class="avatar" style="width:40px; height:40px; background:#00a884; border-radius:50%; display:flex; align-items:center; justify-content:center; font-weight:bold;">${displayName.charAt(0).toUpperCase()}</div>
                <div class="friend-info">
                    <div class="friend-number" style="font-weight:bold; color:#e9edef;">${displayName}</div>
                    <div class="last-msg" style="font-size:12px; color:#8696a0; margin-top:3px;">${lastMsg}</div>
                </div>
            `;
            container.appendChild(div);
        });
    }

    window.filterOrStartChat = function() {
        const query = document.getElementById('searchInput').value.toLowerCase();
        const filtered = {};
        Object.keys(allChatsData).forEach(phone => {
            const name = (savedContactNames[phone] || "").toLowerCase();
            if (phone.toLowerCase().includes(query) || name.includes(query)) {
                filtered[phone] = allChatsData[phone];
            }
        });
        renderChatList(filtered);
    };

    window.openChat = function(partnerPhone) {
        activeChatPartner = partnerPhone;
        document.getElementById('homeScreen').style.display = 'none';
        document.getElementById('chatScreen').style.display = 'flex';
        document.getElementById('chatTargetName').textContent = savedContactNames[partnerPhone] || partnerPhone;

        const chatId = getChatId(currentUser, activeChatPartner);
        
        // রিয়েল-টাইম মেসেজ লোড
        onValue(ref(db, 'messages/' + chatId), (snapshot) => {
            const msgContainer = document.getElementById('chatMessagesContainer');
            msgContainer.innerHTML = '';
            if (!snapshot.exists()) return;

            snapshot.forEach((childSnap) => {
                const msgKey = childSnap.key;
                const msg = childSnap.val();
                const isMe = String(msg.sender) === String(currentUser);
                const div = document.createElement('div');
                div.className = 'msg ' + (isMe ? 'sent' : 'received');
                div.style.cssText = isMe ? "background: #005c4b; padding: 8px 12px; border-radius: 8px; max-width: 60%; align-self: flex-end; position:relative;" : "background: #202c33; padding: 8px 12px; border-radius: 8px; max-width: 60%; align-self: flex-start; position:relative;";

                let contentHtml = `<span>${msg.text || ''}</span>`;
                if (msg.type === 'image') {
                    contentHtml = `<img src="${msg.url}" alt="Shared image" style="max-width: 200px; border-radius: 6px;">`;
                } else if (msg.type === 'file') {
                    contentHtml = `<a href="${msg.url}" target="_blank" style="color: #53bdeb; text-decoration: none;">📁 ${msg.fileName}</a>`;
                } else if (msg.type === 'audio') {
                    contentHtml = `<audio controls src="${msg.url}" style="height: 35px; width: 200px;"></audio>`;
                }

                // মেসেজ রিয়্যাকশন দেখানোর ব্যবস্থা
                let reactionHtml = msg.reaction ? `<div style="position: absolute; bottom: -10px; right: 10px; background: #202c33; border-radius: 10px; padding: 2px 5px; font-size:12px;">${msg.reaction}</div>` : '';

                const timeStr = new Date(msg.timestamp).toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
                div.innerHTML = `${contentHtml}<span class="msg-time">${timeStr}</span>${reactionHtml}`;
                
                // মেসেজে ক্লিক করে ইমোজি রিঅ্যাক্ট করার অপশন
                div.ondblclick = () => addReaction(chatId, msgKey, '❤️');

                msgContainer.appendChild(div);
            });
            msgContainer.scrollTop = msgContainer.scrollHeight;
        });

        // টাইপিং স্ট্যাটাস লিসেনার
        onValue(ref(db, 'typing/' + chatId + '/' + partnerPhone), (snapshot) => {
            const statusDiv = document.getElementById('typingStatus');
            if (snapshot.val() === true) {
                statusDiv.textContent = `${savedContactNames[partnerPhone] || partnerPhone} is typing...`;
            } else {
                statusDiv.textContent = '';
            }
        });
    };

    window.goBackHome = function() {
        activeChatPartner = null;
        document.getElementById('chatScreen').style.display = 'none';
        document.getElementById('homeScreen').style.display = 'block';
        loadFriendList();
    };

    function sendDataToChat(payload) {
        if (!activeChatPartner) return;
        const chatId = getChatId(currentUser, activeChatPartner);
        const msgData = {
            sender: currentUser,
            ...payload,
            timestamp: Date.now(),
            status: 'delivered'
        };
        push(ref(db, 'messages/' + chatId), msgData);
        set(ref(db, 'user-chats/' + currentUser + '/' + activeChatPartner), { lastMessage: payload.text || `[${payload.type}]`, timestamp: Date.now() });
        set(ref(db, 'user-chats/' + activeChatPartner + '/' + currentUser), { lastMessage: payload.text || `[${payload.type}]`, timestamp: Date.now() });
        
        // মেসেজ পাঠানোর পর টাইপিং স্ট্যাটাস ফলস করে দেওয়া
        set(ref(db, 'typing/' + chatId + '/' + currentUser), false);
    }

    window.sendMessage = function() {
        const input = document.getElementById('messageInput');
        const text = input.value.trim();
        if (!text) return;
        sendDataToChat({ type: 'text', text: text });
        input.value = '';
    };

    window.handleEnter = function(e) {
        if (e.key === 'Enter') sendMessage();
    };

    // ১. ছবি বা ফাইল আপলোড হ্যান্ডলার
    window.handleMediaUpload = function(input) {
        const file = input.files[0];
        if (!file) return;
        // লোকাল বা ডামি প্রিভিউ লিংক (ফায়ারবেস স্টোরেজ বা বেস৬৪ ইউআরএল)
        const reader = new FileReader();
        reader.onload = function(e) {
            const fileType = file.type.startsWith('image/') ? 'image' : 'file';
            sendDataToChat({
                type: fileType,
                url: e.target.result,
                fileName: file.name,
                text: file.name
            });
        };
        reader.readAsDataURL(file);
    };

    // ২. লাইভ টাইপিং নোটিফিকেশন
    let typingTimer;
    window.notifyTyping = function() {
        if (!activeChatPartner) return;
        const chatId = getChatId(currentUser, activeChatPartner);
        set(ref(db, 'typing/' + chatId + '/' + currentUser), true);
        
        clearTimeout(typingTimer);
        typingTimer = setTimeout(() => {
            set(ref(db, 'typing/' + chatId + '/' + currentUser), false);
        }, 2000);
    };

    // ৩. মেসেজ রিঅ্যাকশন যোগ করা
    function addReaction(chatId, msgKey, emoji) {
        set(ref(db, `messages/${chatId}/${msgKey}/reaction`), emoji);
    }

    // ৪. ভয়েস রেকর্ড সিমুলেশন / টগল
    let isRecording = false;
    window.toggleVoiceRecording = function() {
        const btn = document.getElementById('voiceRecordBtn');
        if (!isRecording) {
            isRecording = true;
            btn.style.color = '#ff4d4d';
            // এখানে ব্রাউজারের MediaRecorder API ব্যবহার করে ভয়েস রেকর্ড করা যাবে
            alert("Recording started... (Click mic again to stop & send)");
        } else {
            isRecording = false;
            btn.style.color = '#8696a0';
            // ডামি ভয়েস নোট পাঠানো
            sendDataToChat({ type: 'audio', url: '#', text: '[Voice Note]' });
        }
    };

    // ৫. অ্যাপ বা চ্যাট লিংক শেয়ার করার অপশন
    window.shareAppOrChat = function() {
        if (navigator.share) {
            navigator.share({
                title: 'Web Chat App',
                text: 'Come chat with me on this awesome web app!',
                url: window.location.href,
            }).catch(console.error);
        } else {
            prompt("Copy this link to share:", window.location.href);
        }
    };
</script>
</body>
</html>
