
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chatty - Realtime Chat App</title>
    <link rel="manifest" href="./manifest.json">
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        body {
            background-color: #0b141a;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }
        .container {
            width: 100%;
            max-width: 480px;
            height: 100vh;
            max-height: 750px;
            background: #fff;
            box-shadow: 0 4px 15px rgba(0,0,0,0.3);
            display: flex;
            flex-direction: column;
            overflow: hidden;
            border-radius: 12px;
        }
        .screen {
            display: none;
            flex-direction: column;
            height: 100%;
            width: 100%;
        }
        .screen.active {
            display: flex;
        }
        .login-box {
            padding: 40px 25px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            height: 100%;
            background: #ffffff;
        }
        .login-box h2 {
            text-align: center;
            color: #00a884;
            margin-bottom: 30px;
            font-size: 24px;
        }
        .input-group {
            margin-bottom: 15px;
        }
        .input-group label {
            display: block;
            margin-bottom: 5px;
            color: #333;
            font-size: 14px;
            font-weight: 600;
        }
        .input-group input {
            width: 100%;
            padding: 12px;
            border: 1px solid #ccc;
            border-radius: 6px;
            font-size: 15px;
            outline: none;
        }
        .input-group input:focus {
            border-color: #00a884;
        }
        .btn {
            width: 100%;
            padding: 13px;
            background: #00a884;
            color: #fff;
            border: none;
            border-radius: 6px;
            font-size: 16px;
            cursor: pointer;
            font-weight: bold;
            margin-top: 10px;
        }
        .btn:hover {
            background: #01755f;
        }
        .error-msg {
            color: #d32f2f;
            font-size: 13px;
            text-align: center;
            margin-top: 10px;
            min-height: 18px;
        }
        .header {
            background: #202c33;
            color: #e9edef;
            padding: 15px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .header h3 {
            font-size: 18px;
        }
        .header-actions {
            display: flex;
            gap: 12px;
            align-items: center;
        }
        .header-btn {
            background: rgba(255,255,255,0.1);
            border: none;
            color: #fff;
            padding: 6px 12px;
            border-radius: 4px;
            cursor: pointer;
            font-size: 13px;
        }
        .search-bar {
            padding: 8px 12px;
            background: #111b21;
            display: flex;
            align-items: center;
        }
        .search-bar input {
            width: 100%;
            padding: 8px 14px;
            background: #202c33;
            border: none;
            border-radius: 20px;
            color: #e9edef;
            outline: none;
            font-size: 14px;
        }
        .new-chat-bar {
            padding: 10px;
            background: #202c33;
            display: flex;
            gap: 8px;
            border-bottom: 1px solid #222d34;
        }
        .new-chat-bar input {
            flex: 1;
            padding: 10px 14px;
            background: #2a3942;
            border: none;
            color: #e9edef;
            border-radius: 20px;
            outline: none;
            font-size: 14px;
        }
        .new-chat-bar button {
            background: #00a884;
            color: #111b21;
            border: none;
            border-radius: 20px;
            padding: 0 16px;
            cursor: pointer;
            font-weight: bold;
            font-size: 14px;
        }
        .friend-list {
            flex: 1;
            overflow-y: auto;
            background: #111b21;
        }
        .empty-state {
            text-align: center;
            color: #8696a0;
            padding: 40px 20px;
            font-size: 14px;
        }
        .friend-item {
            padding: 12px 15px;
            border-bottom: 1px solid #222d34;
            display: flex;
            align-items: center;
            cursor: pointer;
        }
        .friend-item:hover {
            background: #202c33;
        }
        .avatar {
            width: 45px;
            height: 45px;
            background: #00a884;
            color: #fff;
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            font-weight: bold;
            font-size: 16px;
            margin-right: 12px;
        }
        .friend-info {
            flex: 1;
            overflow: hidden;
        }
        .friend-number {
            font-weight: 600;
            color: #e9edef;
            font-size: 15px;
            margin-bottom: 3px;
        }
        .last-msg {
            color: #8696a0;
            font-size: 13px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .chat-screen {
            display: none;
            flex-direction: column;
            height: 100%;
            flex: 1;
            overflow: hidden;
        }
        .chat-screen.active {
            display: flex;
        }
        .chat-header {
            background: #202c33;
            color: #e9edef;
            padding: 10px 15px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            position: relative;
        }
        .chat-header-left {
            display: flex;
            align-items: center;
            gap: 10px;
        }
        .back-btn {
            background: none;
            border: none;
            color: #e9edef;
            font-size: 20px;
            cursor: pointer;
        }
        .chat-header-right {
            display: flex;
            gap: 15px;
            align-items: center;
            font-size: 18px;
            color: #aebac1;
            cursor: pointer;
        }
        /* Popup Dropdown Menu for Chat options */
        .dropdown-menu {
            display: none;
            position: absolute;
            right: 15px;
            top: 55px;
            background: #233138;
            border-radius: 4px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.3);
            width: 180px;
            z-index: 100;
        }
        .dropdown-menu.show {
            display: block;
        }
        .dropdown-item {
            padding: 12px 16px;
            color: #e9edef;
            font-size: 14px;
            cursor: pointer;
        }
        .dropdown-item:hover {
            background: #182229;
        }

        .chat-messages {
            flex: 1;
            padding: 15px;
            overflow-y: auto;
            background-color: #0b141a;
            background-image: url("data:image/svg+xml,%3Csvg width='100' height='100' viewBox='0 0 100 100' xmlns='http://www.w3.org/2000/svg'%3E%3Cg fill='%23182229' fill-opacity='0.4'%3E%3Ccircle cx='20' cy='20' r='3'/%3E%3Cpath d='M50 15 L55 25 L45 25 Z'/%3E%3Crect x='75' y='15' width='8' height='8' rx='2'/%3E%3Cpath d='M15 55 Q25 45 35 55 T55 55' fill='none' stroke='%23182229' stroke-width='2'/%3E%3Ccircle cx='80' cy='60' r='4'/%3E%3Cpath d='M25 80 L32 88 L20 90 Z'/%3E%3Crect x='60' y='78' width='10' height='6' rx='3'/%3E%3C/g%3E%3C/svg%3E");
            display: flex;
            flex-direction: column;
            gap: 8px;
        }
        .msg {
            max-width: 75%;
            padding: 8px 12px;
            border-radius: 8px;
            font-size: 14px;
            line-height: 1.4;
            word-wrap: break-word;
            position: relative;
            box-shadow: 0 1px 2px rgba(0,0,0,0.2);
        }
        .msg.sent {
            background: #005c4b;
            color: #e9edef;
            align-self: flex-end;
            border-top-right-radius: 0;
        }
        .msg.received {
            background: #202c33;
            color: #e9edef;
            align-self: flex-start;
            border-top-left-radius: 0;
        }
        .msg-time {
            font-size: 10px;
            color: #8696a0;
            text-align: right;
            margin-top: 4px;
            display: inline-block;
            float: right;
            margin-left: 10px;
        }
        .tick {
            font-size: 12px;
            margin-left: 4px;
            color: #8696a0;
        }
        .tick.seen {
            color: #53bdeb;
        }
        .chat-input-area {
            padding: 10px;
            background: #202c33;
            display: flex;
            gap: 8px;
            align-items: center;
        }
        .chat-input-area input {
            flex: 1;
            padding: 11px 15px;
            border: none;
            background: #2a3942;
            color: #e9edef;
            border-radius: 20px;
            outline: none;
            font-size: 15px;
        }
        .send-btn {
            background: #00a884;
            color: #111b21;
            border: none;
            padding: 0 18px;
            height: 40px;
            border-radius: 20px;
            cursor: pointer;
            font-weight: bold;
        }
    </style>
</head>
<body>

<div class="container">
    <!-- Login Screen -->
    <div id="loginScreen" class="screen active">
        <div class="login-box">
            <h2>Chatty Login</h2>
            <div class="input-group">
                <label>Phone Number</label>
                <input type="tel" id="loginPhone" placeholder="Enter phone number">
            </div>
            <div class="input-group">
                <label>Password</label>
                <input type="password" id="loginPass" placeholder="Enter password">
            </div>
            <button class="btn" onclick="handleLogin()">Login</button>
            <div id="loginError" class="error-msg"></div>
            
            <p style="text-align: center; margin-top: 15px; font-size: 14px; color: #555;">
                অ্যাকাউন্ট নেই? <a href="#" onclick="showRegisterScreen()" style="color: #00a884; font-weight: bold;">Register করুন</a>
            </p>
        </div>
    </div>

    <!-- Register Screen -->
    <div id="registerScreen" class="screen">
        <div class="login-box">
            <h2>Create Account</h2>
            <div class="input-group">
                <label>Phone Number</label>
                <input type="tel" id="regPhone" placeholder="Enter phone number">
            </div>
            <div class="input-group">
                <label>Password</label>
                <input type="password" id="regPass" placeholder="Enter password">
            </div>
            <button class="btn" onclick="handleRegister()">Register</button>
            <div id="regError" class="error-msg"></div>
            
            <p style="text-align: center; margin-top: 15px; font-size: 14px; color: #555;">
                ইতিমধ্যে অ্যাকাউন্ট আছে? <a href="#" onclick="showLoginScreen()" style="color: #00a884; font-weight: bold;">Login করুন</a>
            </p>
        </div>
    </div>

    <!-- Home Screen -->
    <div id="homeScreen" class="screen">
        <div class="header">
            <h3 id="currentUserDisplay">Chatty</h3>
            <div class="header-actions">
                <button class="header-btn" onclick="logout()">Logout</button>
            </div>
        </div>
        <div class="search-bar">
            <input type="text" id="searchInput" placeholder="Search or start new chat" oninput="filterChats()">
        </div>
        <div class="new-chat-bar">
            <input type="tel" id="targetPhoneInput" placeholder="Enter number to message...">
            <button onclick="startChatWithNumber()">Chat</button>
        </div>
        <div id="friendListContainer" class="friend-list"></div>
    </div>

    <!-- Chat Screen -->
    <div id="chatScreen" class="chat-screen">
        <div class="chat-header">
            <div class="chat-header-left">
                <button class="back-btn" onclick="goBackHome()">&#8592;</button>
                <h3 id="chatTargetName">Number</h3>
            </div>
            <div class="chat-header-right">
                <span title="Voice Call" onclick="alert('Calling feature coming soon!')">&#128222;</span>
                <span title="Menu" onclick="toggleMenu()">&#8942;</span>
            </div>
            <!-- Dropdown Menu -->
            <div id="chatDropdown" class="dropdown-menu">
                <div class="dropdown-item" onclick="alert('View contact info')">View contact</div>
                <div class="dropdown-item" onclick="alert('Media, links, and docs')">Media & docs</div>
                <div class="dropdown-item" onclick="goBackHome()">Close Chat</div>
            </div>
        </div>
        <div id="chatMessagesContainer" class="chat-messages"></div>
        <div class="chat-input-area">
            <input type="text" id="messageInput" placeholder="Type a message..." onkeypress="handleEnter(event)">
            <button class="send-btn" onclick="sendMessage()">Send</button>
        </div>
    </div>
</div>

<!-- Firebase SDKs -->
<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { getDatabase, ref, set, get, child, push, onValue } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js";
    import { getAuth, signInWithEmailAndPassword, createUserWithEmailAndPassword } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";

    const firebaseConfig = {
      apiKey: "AIzaSyA6OaT_Byxdym5F5EkrBQHlfKwPai5uKVA",
      authDomain: "my-cet-apas.firebaseapp.com",
      databaseURL: "https://my-cet-apas-default-rtdb.firebaseio.com",
      projectId: "my-cet-apas",
      storageBucket: "my-cet-apas.firebasestorage.app",
      messagingSenderId: "707932206149",
      appId: "1:707932206149:web:cbe7d8a52f23e488d1df2c"
    };

    const app = initializeApp(firebaseConfig);
    const db = getDatabase(app);
    const auth = getAuth(app);

    let currentUser = localStorage.getItem('chatApp_currentuser') || null;
    let activeChatPartner = null;
    let allChatsData = {};

    window.onload = function() {
        if (currentUser) {
            showHomeScreen();
        }
    };

    window.showLoginScreen = function() {
        document.getElementById('registerScreen').classList.remove('active');
        document.getElementById('loginScreen').classList.add('active');
    }

    window.showRegisterScreen = function() {
        document.getElementById('loginScreen').classList.remove('active');
        document.getElementById('registerScreen').classList.add('active');
    }

    window.handleLogin = async function() {
        const phone = document.getElementById('loginPhone').value.trim();
        const pass = document.getElementById('loginPass').value;
        const errorEl = document.getElementById('loginError');

        if (!phone || !pass) {
            errorEl.textContent = "Phone number and password are required.";
            return;
        }

        const email = phone + "@chatty.app";
        try {
            await signInWithEmailAndPassword(auth, email, pass);
            currentUser = phone;
            localStorage.setItem('chatApp_currentuser', phone);
            errorEl.textContent = '';
            showHomeScreen();
        } catch (error) {
            errorEl.textContent = "Login error: " + error.message;
        }
    };

    window.handleRegister = async function() {
        const phone = document.getElementById('regPhone').value.trim();
        const pass = document.getElementById('regPass').value;
        const errorEl = document.getElementById('regError');

        if (!phone || !pass) {
            errorEl.textContent = "Phone number and password are required.";
            return;
        }

        const email = phone + "@chatty.app";
        try {
            await createUserWithEmailAndPassword(auth, email, pass);
            
            const userRef = ref(db, 'users/' + phone);
            await set(userRef, {
                password: pass,
                createdAt: Date.now()
            });

            currentUser = phone;
            localStorage.setItem('chatApp_currentuser', phone);
            errorEl.textContent = '';
            showHomeScreen();
        } catch (error) {
            errorEl.textContent = "Registration error: " + error.message;
        }
    };

    function showHomeScreen() {
        document.getElementById('loginScreen').classList.remove('active');
        document.getElementById('registerScreen').classList.remove('active');
        document.getElementById('chatScreen').classList.remove('active');
        document.getElementById('homeScreen').classList.add('active');
        loadFriendList();
    }

    window.logout = function() {
        localStorage.removeItem('chatApp_currentuser');
        currentUser = null;
        document.getElementById('homeScreen').classList.remove('active');
        document.getElementById('chatScreen').classList.remove('active');
        document.getElementById('loginScreen').classList.add('active');
        document.getElementById('loginPhone').value = '';
        document.getElementById('loginPass').value = '';
    };

    window.startChatWithNumber = function() {
        const targetPhone = document.getElementById('targetPhoneInput').value.trim();
        if (!targetPhone) return;
        if (targetPhone === currentUser) {
            alert("You cannot chat with yourself.");
            return;
        }
        document.getElementById('targetPhoneInput').value = '';
        openChat(targetPhone);
    };

    function getChatId(user1, user2) {
        return user1 < user2 ? `${user1}_${user2}` : `${user2}_${user1}`;
    }

    function loadFriendList() {
        const container = document.getElementById('friendListContainer');
        const chatsRef = ref(db, 'user-chats/' + currentUser);

        onValue(chatsRef, (snapshot) => {
            container.innerHTML = "";
            if (!snapshot.exists()) {
                allChatsData = {};
                container.innerHTML = `<div class="empty-state">No chats yet. Enter a number above to start messaging!</div>`;
                return;
            }

            allChatsData = snapshot.val();
            renderChatList(allChatsData);
        });
    }

    function renderChatList(chats) {
        const container = document.getElementById('friendListContainer');
        container.innerHTML = "";

        const keys = Object.keys(chats);
        if (keys.length === 0) {
            container.innerHTML = `<div class="empty-state">No chats found.</div>`;
            return;
        }

        keys.forEach(partnerPhone => {
            const lastMsg = chats[partnerPhone].lastMessage || "";
            const div = document.createElement('div');
            div.className = 'friend-item';
            div.onclick = () => openChat(partnerPhone);
            div.innerHTML = `
                <div class="avatar">${partnerPhone.charAt(0)}</div>
                <div class="friend-info">
                    <div class="friend-number">${partnerPhone}</div>
                    <div class="last-msg">${lastMsg}</div>
                </div>
            `;
            container.appendChild(div);
        });
    }

    window.filterChats = function() {
        const query = document.getElementById('searchInput').value.toLowerCase();
        const filtered = {};
        Object.keys(allChatsData).forEach(phone => {
            if (phone.toLowerCase().includes(query)) {
                filtered[phone] = allChatsData[phone];
            }
        });
        renderChatList(filtered);
    };

    window.toggleMenu = function() {
        const dropdown = document.getElementById('chatDropdown');
        dropdown.classList.toggle('show');
    }

    window.openChat = function(partnerPhone) {
        activeChatPartner = partnerPhone;
        document.getElementById('homeScreen').classList.remove('active');
        document.getElementById('chatScreen').classList.add('active');
        document.getElementById('chatTargetName').textContent = partnerPhone;

        const chatId = getChatId(currentUser, activeChatPartner);
        const messagesRef = ref(db, 'messages/' + chatId);
        const msgContainer = document.getElementById('chatMessagesContainer');

        onValue(messagesRef, (snapshot) => {
            msgContainer.innerHTML = '';
            if (!snapshot.exists()) return;

            snapshot.forEach((childSnap) => {
                const msg = childSnap.val();
                const msgKey = childSnap.key;
                const isMe = String(msg.sender) === String(currentUser);

                if (!isMe && msg.status !== 'seen') {
                    set(ref(db, 'messages/' + chatId + '/' + msgKey + '/status'), 'seen');
                }

                const div = document.createElement('div');
                div.className = 'msg ' + (isMe ? 'sent' : 'received');

                let tickHtml = '';
                if (isMe) {
                    if (msg.status === 'seen') {
                        tickHtml = '<span class="tick seen">&#10003;&#10003;</span>';
                    } else if (msg.status === 'delivered') {
                        tickHtml = '<span class="tick">&#10003;&#10003;</span>';
                    } else {
                        tickHtml = '<span class="tick">&#10003;</span>';
                    }
                }

                const timeStr = new Date(msg.timestamp).toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
                div.innerHTML = `
                    <span>${msg.text}</span>
                    <span class="msg-time">${timeStr} ${tickHtml}</span>
                `;
                msgContainer.appendChild(div);
            });
            msgContainer.scrollTop = msgContainer.scrollHeight;
        });
    };

    window.goBackHome = function() {
        activeChatPartner = null;
        document.getElementById('chatDropdown').classList.remove('show');
        document.getElementById('chatScreen').classList.remove('active');
        document.getElementById('homeScreen').classList.add('active');
        loadFriendList();
    };

    window.sendMessage = function() {
        const input = document.getElementById('messageInput');
        const text = input.value.trim();
        if (!text || !activeChatPartner) return;

        const chatId = getChatId(currentUser, activeChatPartner);
        const messagesRef = ref(db, 'messages/' + chatId);
        const rawMessageRef = push(messagesRef);

        const msgData = {
            sender: currentUser,
            text: text,
            timestamp: Date.now(),
            status: 'delivered'
        };

        set(rawMessageRef, msgData);

        set(ref(db, 'user-chats/' + currentUser + '/' + activeChatPartner), { lastMessage: text, timestamp: Date.now() });
        set(ref(db, 'user-chats/' + activeChatPartner + '/' + currentUser), { lastMessage: text, timestamp: Date.now() });

        input.value = '';
    };

    window.handleEnter = function(e) {
        if (e.key === 'Enter') {
            sendMessage();
        }
    };
</script>

<script>
    if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
            navigator.serviceWorker.register('./sw.js')
            .then(() => console.log('Service Worker registered!'))
            .catch((err) => console.log('Service Worker registration failed: ', err));
        });
    }
</script>
</body>
</html>
