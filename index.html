<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chatty - Premium Web Chat</title>

    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-database-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-auth-compat.js"></script>

    <style>
        :root {
            --bg-main: #111b21;
            --bg-header: #202c33;
            --bg-input: #2a3942;
            --accent: #00a884;
            --msg-sent: #005c4b;
            --msg-received: #202c33;
            --text-primary: #e9edef;
            --text-secondary: #8696a0;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }

        body {
            background-color: var(--bg-main);
            color: var(--text-primary);
            height: 100vh;
            overflow: hidden;
        }

        .screen {
            display: none;
            flex-direction: column;
            height: 100vh;
            width: 100%;
        }

        .screen.active {
            display: flex;
        }

        .home-header {
            background: var(--bg-header);
            padding: 12px 16px;
            display: flex;
            align-items: center;
            gap: 14px;
        }

        .my-profile-avatar {
            width: 42px;
            height: 42px;
            border-radius: 50%;
            background: var(--accent);
            color: #fff;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: bold;
            cursor: pointer;
        }

        .app-title {
            font-size: 20px;
            font-weight: bold;
        }

        .search-container {
            padding: 8px 12px;
            background: var(--bg-main);
        }

        .search-box {
            width: 100%;
            padding: 8px 12px 8px 32px;
            background: var(--bg-input);
            border: none;
            border-radius: 8px;
            color: var(--text-primary);
            font-size: 14px;
            outline: none;
        }

        .friend-list {
            flex: 1;
            overflow-y: auto;
            background: var(--bg-main);
        }

        .chat-screen {
            display: none;
            flex-direction: column;
            height: 100vh;
            width: 100%;
            background: #0b141a;
        }

        .chat-screen.active {
            display: flex;
        }

        .chat-header {
            background: var(--bg-header);
            padding: 10px 16px;
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .back-btn {
            background: none;
            border: none;
            color: var(--text-secondary);
            font-size: 20px;
            cursor: pointer;
        }

        .chat-messages {
            flex: 1;
            padding: 16px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .chat-input-area {
            background: var(--bg-header);
            padding: 10px 16px;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .message-input {
            flex: 1;
            background: var(--bg-input);
            border: none;
            padding: 10px 14px;
            border-radius: 8px;
            color: var(--text-primary);
            outline: none;
        }

        .send-btn {
            background: var(--accent);
            border: none;
            color: white;
            padding: 10px 16px;
            border-radius: 8px;
            cursor: pointer;
            font-weight: bold;
        }
    </style>
</head>
<body>

    <div id="homeScreen" class="screen active">
        <div class="home-header">
            <div class="my-profile-avatar" id="headerAvatar">0</div>
            <div class="app-title">Chatty</div>
        </div>
        <div class="search-container">
            <input type="text" id="searchInput" class="search-box" placeholder="Search or pick contact...">
        </div>
        <div id="friendListContainer" class="friend-list"></div>
    </div>

    <div id="chatScreen" class="screen">
        <div class="chat-header">
            <button class="back-btn" onclick="goBackHome()">←</button>
            <div id="chatTargetName" style="font-weight: bold; font-size: 16px;">Chat</div>
        </div>
        <div id="chatMessagesContainer" class="chat-messages"></div>
        <div class="chat-input-area">
            <input type="text" id="messageInput" class="message-input" placeholder="Type a message">
            <button class="send-btn" onclick="sendMessage()">Send</button>
        </div>
    </div>

    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyA6DsT_8ysdywGF5EkrBQH1FKwFuls0kVA",
            authDomain: "my-cet-apas.firebaseapp.com",
            databaseURL: "https://my-cet-apas-default-rtdb.firebaseio.com",
            projectId: "my-cet-apas",
            storageBucket: "my-cet-apas.appspot.com",
            messagingSenderId: "707932206149",
            appId: "1:707932206149:web:cbe7d8a52f23e488d1df2c"
        };

        firebase.initializeApp(firebaseConfig);
        const db = firebase.database();

        let currentUser = localStorage.getItem('chatty_current_user');
        if (!currentUser) {
            currentUser = prompt("Enter your phone number or unique ID to login:") || "user_" + Math.floor(Math.random()*1000);
            localStorage.setItem('chatty_current_user', currentUser);
        }

        document.getElementById('headerAvatar').innerText = currentUser.charAt(0).toUpperCase();

        function goBackHome() {
            document.getElementById('chatScreen').classList.remove('active');
            document.getElementById('homeScreen').classList.add('active');
        }

        function loadFriendList() {
            const container = document.getElementById('friendListContainer');
            db.ref('user-chats/' + currentUser).on('value', (snapshot) => {
                container.innerHTML = "";
                if (!snapshot.exists()) {
                    container.innerHTML = `<div style="padding:30px; text-align:center; color:var(--text-secondary);">No chats yet. Start a new chat!</div>`;
                    return;
                }
                const chats = snapshot.val();
                for (let chatId in chats) {
                    container.innerHTML += `<div style="padding:15px; border-bottom:1px solid #222d34; cursor:pointer;" onclick="openChat('${chats[chatId].contact}')">${chats[chatId].contact}</div>`;
                }
            });
        }

        function openChat(contactId) {
            document.getElementById('homeScreen').classList.remove('active');
            document.getElementById('chatScreen').classList.add('active');
            document.getElementById('chatTargetName').innerText = contactId;
        }

        function sendMessage() {
            const input = document.getElementById('messageInput');
            if (!input.value.trim()) return;
            input.value = "";
        }

        loadFriendList();
    </script>
</body>
</html>
