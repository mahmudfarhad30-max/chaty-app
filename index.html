<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chatty - Premium Web Chat</title>

    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-database-compat.js"></script>

    <style>
        :root {
            --bg-main: #111b21;
            --bg-header: #202c33;
            --bg-input: #2a3942;
            --accent: #00a884;
            --msg-sent: #005c4b;
            --msg-received: #202c33;
            --text-primary: #e9edef;
            --text-secondary: #8696a0;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }

        body {
            background-color: var(--bg-main);
            color: var(--text-primary);
            height: 100vh;
            overflow: hidden;
        }

        .screen {
            display: none;
            flex-direction: column;
            height: 100vh;
            width: 100%;
        }

        .screen.active {
            display: flex;
        }

        .home-header, .chat-header {
            background: var(--bg-header);
            padding: 12px 16px;
            display: flex;
            align-items: center;
            gap: 14px;
        }

        .my-profile-avatar, .avatar {
            width: 42px;
            height: 42px;
            border-radius: 50%;
            background: var(--accent);
            color: #fff;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: bold;
            cursor: pointer;
        }

        .app-title {
            font-size: 20px;
            font-weight: bold;
            flex: 1;
        }

        .menu-icon-btn, .action-icon-btn {
            background: none;
            border: none;
            color: var(--text-secondary);
            font-size: 20px;
            cursor: pointer;
            padding: 8px;
        }

        .search-container {
            padding: 8px 12px;
            background: var(--bg-main);
        }

        .search-box, .message-input {
            width: 100%;
            padding: 10px 14px;
            background: var(--bg-input);
            border: none;
            border-radius: 8px;
            color: var(--text-primary);
            font-size: 14px;
            outline: none;
        }

        .friend-list {
            flex: 1;
            overflow-y: auto;
            background: var(--bg-main);
        }

        .friend-item {
            padding: 12px 16px;
            border-bottom: 1px solid #222d34;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .friend-item:hover {
            background: #202c33;
        }

        .chat-screen {
            background: #0b141a;
        }

        .back-btn {
            background: none;
            border: none;
            color: var(--text-secondary);
            font-size: 20px;
            cursor: pointer;
        }

        .chat-messages {
            flex: 1;
            padding: 16px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 8px;
            background: #0b141a;
        }

        .msg {
            max-width: 75%;
            padding: 9px 13px;
            border-radius: 8px;
            font-size: 14px;
            line-height: 1.4;
            word-wrap: break-word;
            color: var(--text-primary);
        }

        .msg.sent {
            background: var(--msg-sent);
            align-self: flex-end;
        }

        .msg.received {
            background: var(--msg-received);
            align-self: flex-start;
        }

        .chat-input-area {
            background: var(--bg-header);
            padding: 10px 16px;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .send-btn {
            background: var(--accent);
            border: none;
            color: white;
            padding: 10px 16px;
            border-radius: 8px;
            cursor: pointer;
            font-weight: bold;
        }

        .modal {
            display: none;
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.7);
            justify-content: center;
            align-items: center;
            z-index: 9999;
        }

        .modal.active {
            display: flex;
        }

        .modal-content {
            background: var(--bg-header);
            padding: 24px;
            border-radius: 12px;
            width: 90%;
            max-width: 400px;
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        .modal-btn {
            background: var(--bg-input);
            border: none;
            color: var(--text-primary);
            padding: 12px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 15px;
            text-align: left;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .modal-btn:hover {
            background: #374248;
        }

        .logout-btn {
            background: rgba(239, 68, 68, 0.15);
            color: #ef4444;
            border: 1px solid #ef4444;
        }
    </style>
</head>
<body>

    <!-- হোম স্ক্রিন -->
    <div id="homeScreen" class="screen active">
        <div class="home-header">
            <div class="my-profile-avatar" id="headerAvatar">0</div>
            <div class="app-title">Chatty</div>
            <button class="menu-icon-btn" id="menuBtn">⋮</button>
        </div>
        <div class="search-container">
            <input type="text" id="searchInput" class="search-box" placeholder="Search or enter user ID to chat...">
        </div>
        <div id="friendListContainer" class="friend-list"></div>
    </div>

    <!-- চ্যাট স্ক্রিন -->
    <div id="chatScreen" class="screen chat-screen">
        <div class="chat-header">
            <button class="back-btn" id="backBtn">←</button>
            <div class="avatar" id="chatHeaderAvatar">U</div>
            <div style="flex: 1;">
                <div id="chatTargetName" style="font-weight: bold; font-size: 15px;">Chat</div>
                <div id="typingStatus" style="font-size: 10px; color: var(--accent);">online</div>
            </div>
            <button class="action-icon-btn" id="audioCallBtn" title="Audio Call">📞</button>
            <button class="action-icon-btn" id="videoCallBtn" title="Video Call">📹</button>
            <button class="action-icon-btn" id="attachBtn" title="Share Media">📎</button>
            <input type="file" id="mediaFileInput" style="display: none;">
        </div>
        <div id="chatMessagesContainer" class="chat-messages"></div>
        <div class="chat-input-area">
            <input type="text" id="messageInput" class="message-input" placeholder="Type a message...">
            <button class="send-btn" id="sendBtn">Send</button>
        </div>
    </div>

    <!-- মেনু মোডাল -->
    <div id="menuModal" class="modal">
        <div class="modal-content">
            <h3 style="margin-bottom: 5px;">Menu & Options</h3>
            <button class="modal-btn" id="groupCreateBtn">👥 Create New Group</button>
            <button class="modal-btn" id="settingsBtn">⚙️ Settings</button>
            <button class="modal-btn" id="premiumBtn">⭐ Go Premium</button>
            <button class="modal-btn logout-btn" id="logoutBtn">🚪 Logout</button>
            <button class="modal-btn" style="background:transparent; text-align:center; justify-content:center;" id="closeMenuBtn">Close</button>
        </div>
    </div>

    <!-- প্রিমিয়াম স্ক্রিন মোডাল -->
    <div id="premiumModal" class="modal">
        <div class="modal-content" style="text-align: center;">
            <h2>⭐ Chatty Premium</h2>
            <p style="color: var(--text-secondary); font-size: 14px;">Unlock unlimited media sharing, custom themes, and ad-free experience!</p>
            <button class="send-btn" id="upgradeBtn">Upgrade Now</button>
            <button class="modal-btn" style="background:transparent; justify-content:center;" id="closePremiumBtn">Back</button>
        </div>
    </div>

    <!-- সেটিংস মোডাল -->
    <div id="settingsModal" class="modal">
        <div class="modal-content">
            <h3>Settings</h3>
            <label style="font-size: 13px; color: var(--text-secondary);">Change Username:</label>
            <input type="text" id="settingsUsernameInput" class="message-input">
            <button class="send-btn" id="saveSettingsBtn">Save Changes</button>
            <button class="modal-btn" style="background:transparent; justify-content:center;" id="closeSettingsBtn">Cancel</button>
        </div>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', function() {
            const firebaseConfig = {
                apiKey: "AIzaSyA6DsT_8ysdywGF5EkrBQH1FKwFuls0kVA",
                authDomain: "my-cet-apas.firebaseapp.com",
                databaseURL: "https://my-cet-apas-default-rtdb.firebaseio.com",
                projectId: "my-cet-apas",
                storageBucket: "my-cet-apas.appspot.com",
                messagingSenderId: "707932206149",
                appId: "1:707932206149:web:cbe7d8a52f23e488d1df2c"
            };

            if (!firebase.apps.length) {
                firebase.initializeApp(firebaseConfig);
            }
            const db = firebase.database();

            let currentUser = localStorage.getItem('chatty_current_user');
            if (!currentUser) {
                currentUser = prompt("Enter your phone number or unique ID to login:") || "user_" + Math.floor(Math.random()*1000);
                localStorage.setItem('chatty_current_user', currentUser);
            }

            document.getElementById('headerAvatar').innerText = currentUser.charAt(0).toUpperCase();
            let activeChatContact = null;

            window.goBackHome = function() {
                document.getElementById('chatScreen').classList.remove('active');
                document.getElementById('homeScreen').classList.add('active');
                activeChatContact = null;
            }

            window.openChat = function(contactId) {
                if (!contactId) return;
                activeChatContact = contactId;
                document.getElementById('homeScreen').classList.remove('active');
                document.getElementById('chatScreen').classList.add('active');
                document.getElementById('chatTargetName').innerText = contactId;
                document.getElementById('chatHeaderAvatar').innerText = contactId.charAt(0).toUpperCase();
                loadMessages();
            }

            // ইভেন্ট লিসেনার্স
            document.getElementById('backBtn').addEventListener('click', goBackHome);
            document.getElementById('menuBtn').addEventListener('click', () => document.getElementById('menuModal').classList.add('active'));
            document.getElementById('closeMenuBtn').addEventListener('click', () => document.getElementById('menuModal').classList.remove('active'));
            
            document.getElementById('headerAvatar').addEventListener('click', () => alert("Your ID: " + currentUser));

            document.getElementById('groupCreateBtn').addEventListener('click', () => {
                document.getElementById('menuModal').classList.remove('active');
                const groupName = prompt("Enter Group Name:");
                if (groupName) alert("গ্রুপ '" + groupName + "' সফলভাবে তৈরি হয়েছে!");
            });

            document.getElementById('settingsBtn').addEventListener('click', () => {
                document.getElementById('menuModal').classList.remove('active');
                document.getElementById('settingsUsernameInput').value = currentUser;
                document.getElementById('settingsModal').classList.add('active');
            });
            document.getElementById('closeSettingsBtn').addEventListener('click', () => document.getElementById('settingsModal').classList.remove('active'));
            document.getElementById('saveSettingsBtn').addEventListener('click', () => {
                const newName = document.getElementById('settingsUsernameInput').value.trim();
                if (newName) {
                    localStorage.setItem('chatty_current_user', newName);
                    currentUser = newName;
                    document.getElementById('headerAvatar').innerText = currentUser.charAt(0).toUpperCase();
                    alert("সেটিংস সফলভাবে আপডেট হয়েছে!");
                    document.getElementById('settingsModal').classList.remove('active');
                }
            });

            document.getElementById('premiumBtn').addEventListener('click', () => {
                document.getElementById('menuModal').classList.remove('active');
                document.getElementById('premiumModal').classList.add('active');
            });
            document.getElementById('closePremiumBtn').addEventListener('click', () => document.getElementById('premiumModal').classList.remove('active'));
            document.getElementById('upgradeBtn').addEventListener('click', () => alert('Subscription feature activated successfully!'));

            document.getElementById('logoutBtn').addEventListener('click', () => {
                if (confirm("আপনি কি নিশ্চিতভাবে লগ আউট করতে চান?")) {
                    localStorage.removeItem('chatty_current_user');
                    location.reload();
                }
            });

            document.getElementById('audioCallBtn').addEventListener('click', () => alert(activeChatContact + "-এর সাথে অডিও কল শুরু হচ্ছে..."));
            document.getElementById('videoCallBtn').addEventListener('click', () => alert(activeChatContact + "-এর সাথে ভিডিও কল শুরু হচ্ছে..."));
            document.getElementById('attachBtn').addEventListener('click', () => document.getElementById('mediaFileInput').click());
            
            document.getElementById('mediaFileInput').addEventListener('change', function() {
                if (this.files && this.files[0]) {
                    alert("মিডিয়া ফাইল সিলেক্ট হয়েছে: " + this.files[0].name);
                }
            });

            document.getElementById('searchInput').addEventListener('keypress', function(e) {
                if (e.key === 'Enter') {
                    const query = this.value.trim();
                    if (query && query !== currentUser) {
                        openChat(query);
                    }
                }
            });

            function getChatRoomId(user1, user2) {
                return user1 < user2 ? `${user1}_${user2}` : `${user2}_${user1}`;
            }

            function sendMessage() {
                const input = document.getElementById('messageInput');
                const text = input.value.trim();
                if (!text || !activeChatContact) return;

                const roomId = getChatRoomId(currentUser, activeChatContact);
                const messageData = {
                    sender: currentUser,
                    text: text,
                    timestamp: Date.now()
                };

                db.ref('chats/' + roomId).push(messageData);
                db.ref('user-chats/' + currentUser + '/' + activeChatContact).set({ contact: activeChatContact });
                db.ref('user-chats/' + activeChatContact + '/' + currentUser).set({ contact: currentUser });

                input.value = "";
            }

            document.getElementById('sendBtn').addEventListener('click', sendMessage);
            document.getElementById('messageInput').addEventListener('keypress', function(e) {
                if (e.key === 'Enter') sendMessage();
            });

            function loadMessages() {
                if (!activeChatContact) return;
                const roomId = getChatRoomId(currentUser, activeChatContact);
                const container = document.getElementById('chatMessagesContainer');
                
                db.ref('chats/' + roomId).on('value', (snapshot) => {
                    container.innerHTML = "";
                    if (!snapshot.exists()) {
                        container.innerHTML = `<div style="text-align:center; color:var(--text-secondary); margin-top:20px;">No messages yet. Say hello!</div>`;
                        return;
                    }
                    snapshot.forEach((childSnapshot) => {
                        const msg = childSnapshot.val();
                        const msgDiv = document.createElement('div');
                        msgDiv.className = `msg ${msg.sender === currentUser ? 'sent' : 'received'}`;
                        msgDiv.innerText = msg.text;
                        container.appendChild(msgDiv);
                    });
                    container.scrollTop = container.scrollHeight;
                });
            }

            function loadFriendList() {
                const container = document.getElementById('friendListContainer');
                db.ref('user-chats/' + currentUser).on('value', (snapshot) => {
                    container.innerHTML = "";
                    if (!snapshot.exists()) {
                        container.innerHTML = `<div style="padding:30px; text-align:center; color:var(--text-secondary);">No chats yet. Search a user ID above to chat!</div>`;
                        return;
                    }
                    const chats = snapshot.val();
                    for (let chatId in chats) {
                        const contact = chats[chatId].contact;
                        const item = document.createElement('div');
                        item.className = 'friend-item';
                        item.innerHTML = `
                            <div class="avatar">${contact.charAt(0).toUpperCase()}</div>
                            <div style="font-weight:bold; font-size:15px; color:var(--text-primary);">${contact}</div>
                        `;
                        item.addEventListener('click', () => openChat(contact));
                        container.appendChild(item);
                    }
                });
            }

            loadFriendList();
        });
    </script>
</body>
</html>
